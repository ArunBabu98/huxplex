name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  layering:
    name: static gates (layering, arch portability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce the dependency rule
        # docs/10-development/repository-structure.md — a cycle is a build failure.
        run: ./scripts/check-layering.sh
      - name: No architecture-specific backend paths (G0-8, static half)
        # docs/16-action-plan.md § G0 standing rule. Proves nobody WROTE the call; the
        # negative case in the test matrix proves the build would NOTICE if they did.
        run: ./scripts/check-arch-portability.sh

  test:
    name: test (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Architecture portability is a DECENTRALIZATION property, not a convenience: a PQ chain
      # whose crypto builds on only one ISA cannot have a diverse validator set. G0 exists
      # because an unconditional AVX2 call once broke every ARM build.
      matrix:
        include:
          - { os: ubuntu-latest,  arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
          - { os: macos-latest,   arch: aarch64-darwin }
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Report architecture
        run: uname -m && rustc -vV
      - name: Build
        run: cargo build --all-targets --all-features --locked --verbose
      - name: Test
        # Single invocation, identical to scripts/verify-layer0.sh and to the G0-T1 acceptance
        # criterion. --all-targets excludes doctests, hence the separate --doc run below.
        run: cargo test --all-targets --all-features --locked --verbose
      - name: Doctests
        run: cargo test --doc --all-features --locked
      - name: Self-verifying walkthroughs
        run: |
          cargo run -q -p hux-crypto  --example crypto_walkthrough
          cargo run -q -p hux-network --example network_walkthrough
      - name: "G0-T1 negative case — a deliberate avx2:: call must fail here"
        # Skipped on x86-64, where the backend genuinely exists and rejecting it would prove
        # nothing. On aarch64 this is the whole point of the matrix.
        if: matrix.arch != 'x86_64'
        run: ./scripts/check-arch-negative.sh

  reproducible:
    name: reproducible build (G0-T2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Two clean checkouts must produce byte-identical artifacts
        # docs/10-development/ci-cd.md § The recipe. A binary nobody can independently
        # reproduce is a binary everyone has to take on trust.
        run: ./scripts/check-reproducible.sh

  docs:
    name: doc build
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
