[package]
name = "hux-crypto"
description = "Huxplex Layer 0 — post-quantum cryptographic primitives, domain separation, and HD key derivation."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
libcrux-ml-dsa.workspace = true
libcrux-ml-kem.workspace = true
hkdf.workspace = true
sha2.workspace = true
libcrux-sha3.workspace = true
thiserror.workspace = true
hex.workspace = true
bip32.workspace = true
rand.workspace = true
zeroize.workspace = true
subtle.workspace = true
# SLH-DSA-SHAKE-128s (G1 · C7). Pure Rust, `deny(unsafe_code)`; only the one parameter set the
# registry names is compiled. Its RNG interface is rand_core 0.6, hence the renamed import —
# used only by `sig/slh_dsa.rs` to hand it the sealed `opt_rand`.
fips205 = { version = "0.4.1", default-features = false, features = ["slh_dsa_shake_128s"] }
rand_core_06 = { package = "rand_core", version = "0.6.4", default-features = false }
# X25519 for the classical half of the hybrid KEM (G1 · B5). HACL*'s formally verified
# curve25519, the same verified-vendor policy as ML-DSA / ML-KEM. Its latest release (0.0.9) is a
# libcrux generation behind the 0.0.10 crates above, so libcrux-secrets / -traits / -macros
# appear at two versions until cryspen publishes it alongside them.
libcrux-curve25519 = "0.0.9"

# SIMD backends are selected per target architecture. The crypto code always calls libcrux's
# top-level (multiplexing) entry points, which pick a backend at runtime and fall back to the
# portable implementation; these features only make the faster backend available to that
# dispatcher. Never call a backend path such as `mlkem768::avx2::*` directly — it does not
# exist on aarch64. All backends are output-identical.
[target.'cfg(target_arch = "x86_64")'.dependencies]
libcrux-ml-kem = { workspace = true, features = ["simd256"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
libcrux-ml-kem = { workspace = true, features = ["simd128"] }

# Independent oracles for the KAT fixtures (G1 · C10): a second codebase reproducing every
# committed vector makes the fixtures FIPS output rather than one vendor's history. Dev-only —
# never a runtime dependency, never reachable from the library.
[dev-dependencies]
aws-lc-rs = "1.18.1"
ml-dsa = "0.1.1"
ml-kem = "0.3.2"
# Differential oracle for SLH-DSA (G1 · C8).
slh-dsa = "0.2.0-rc.5"
